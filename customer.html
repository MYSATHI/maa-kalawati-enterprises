<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maa Kalawati Enterprises · Customer Portal</title><style>
body{margin:0;background:#f4f7f4;color:#18372d;font:16px system-ui}.head{background:#003b2d;color:#fff;padding:20px;border-bottom:3px solid #f2c94c}.head h1{color:#ffe28a;margin:0}.wrap{max-width:900px;margin:25px auto;padding:15px}.card{background:white;border:1px solid #dce5df;border-radius:14px;padding:20px;margin-bottom:15px}.field{margin:10px 0}.field label{display:block;font-weight:700}.field input{width:100%;padding:12px;border:1px solid #cbd7cf;border-radius:8px;box-sizing:border-box}button{padding:11px 15px;background:#003b2d;color:white;border:0;border-radius:8px;cursor:pointer;font-weight:700}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #ddd;padding:9px} .muted{color:#66786e;font-size:13px}.hidden{display:none}
</style></head><body><header class="head"><h1>MAA KALAWATI ENTERPRISES</h1><p>Your customer account</p></header><main class="wrap">
<section class="card" id="auth"><h2>Customer Login</h2><form id="login"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button>Login</button></form><hr><h3>Create account</h3><form id="register"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Phone with country code</label><input name="phone" required placeholder="+916307140432"></div><div class="field"><label>Password (minimum 12 characters)</label><input name="password" type="password" minlength="12" required></div><button>Create account</button></form><p id="msg" class="muted"></p></section>
<section class="hidden" id="portal"><div class="card"><button id="logout">Log out</button><h2 id="welcome">My account</h2><p>Only your own enquiries and orders are shown here.</p></div><div class="card"><h3>My Orders</h3><div id="orders"></div></div><div class="card"><h3>My Enquiries</h3><div id="enquiries"></div></div><div class="card"><h3>My Messages</h3><div id="messages"></div></div></section>
</main><script src="/customer.js" defer></script></body></html>
